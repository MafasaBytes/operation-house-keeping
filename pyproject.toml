[project]
name = "operation-house-keeping"
version = "0.0.1"
description = "Backend foundation for a living, constraint-aware representation of an engineered system"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "cad: requires the CAD extra (cadquery-ocp) from requirements-cad.txt",
    "pdf: requires the PDF extra (pdfplumber/pypdf) from requirements-pdf.txt",
]
